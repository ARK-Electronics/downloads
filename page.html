<style>
:root {
  --bg: #f4f5f4; --card: #ffffff; --text: #262826; --muted: #6a6e6a; --border: #e2e4e2;
  --hover: #f3f8f4; --accent: #00bb31; --link: #00852a; --logo-grey: #595959;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111311; --card: #191c19; --text: #e6e8e6; --muted: #9aa09a; --border: #2a2e2a;
    --hover: #1f251f; --link: #2fd35a; --logo-grey: #d0d2d0;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--text); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
body { margin: 0; }
a { color: inherit; text-decoration: none; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
header { border-bottom: 1px solid var(--border); background: var(--card); }
.bar { max-width: 56rem; margin: 0 auto; padding: .9rem 1rem; display: flex; align-items: center; gap: .9rem; }
.logo { height: 26px; width: auto; display: block; }
.logo .grey { fill: var(--logo-grey); }
.logo .green { fill: var(--accent); }
.site { font-weight: 500; color: var(--muted); padding-left: .9rem; border-left: 1px solid var(--border); }
main { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.crumbs { font-size: .875rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .35rem; }
.crumbs a { color: var(--link); }
.crumbs a:hover { text-decoration: underline; }
h1 { font-size: 1.6rem; font-weight: 600; margin: .25rem 0 1.25rem; word-break: break-word; }
.list { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: .25rem 1.25rem; padding: .7rem 1rem; border-top: 1px solid var(--border); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.name { display: flex; align-items: center; gap: .65rem; min-width: 0; font-weight: 500; }
.name:hover .label { color: var(--link); }
.label { overflow-wrap: anywhere; }
.icon { width: 20px; height: 20px; flex: none; color: var(--muted); }
.dir .icon { color: var(--accent); }
.desc { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); }
.pill { font-size: .75rem; font-weight: 500; padding: .05rem .5rem; border-radius: 999px; background: var(--accent); color: #fff; white-space: nowrap; }
.meta { font-size: .85rem; color: var(--muted); white-space: nowrap; text-align: right; }
.size { min-width: 5.5rem; }
.sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding-left: calc(20px + .65rem); font-size: .78rem; color: var(--muted); }
.btn { font: inherit; color: var(--link); background: none; border: 1px solid var(--border); border-radius: 6px; padding: .05rem .5rem; cursor: pointer; }
.btn:hover { border-color: var(--link); }
.empty { padding: 1.5rem 1rem; color: var(--muted); }
.actions { margin: -.5rem 0 1rem; font-size: .85rem; }
.doc { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: .25rem 1.5rem 1rem; overflow-wrap: anywhere; }
.doc h1, .doc h2, .doc h3, .doc h4 { font-weight: 600; line-height: 1.3; margin: 1.25rem 0 .5rem; }
.doc h1 { font-size: 1.35rem; }
.doc h2 { font-size: 1.15rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
.doc h3, .doc h4 { font-size: 1rem; }
.doc ul, .doc ol { margin: .5rem 0; padding-left: 1.4rem; }
.doc li { margin: .25rem 0; }
.doc a { color: var(--link); }
.doc a:hover { text-decoration: underline; }
.doc code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .85em; background: var(--hover); border: 1px solid var(--border); border-radius: 4px; padding: .05rem .3rem; }
.doc pre { background: var(--hover); border: 1px solid var(--border); border-radius: 6px; padding: .75rem 1rem; overflow-x: auto; }
.doc pre code { background: none; border: 0; padding: 0; }
footer { max-width: 56rem; margin: 0 auto; padding: 0 1rem 2rem; font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; }
footer a { color: var(--link); }
@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .date { display: none; }
}
</style>

<script>
document.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-sha]');
  if (!b) return;
  navigator.clipboard.writeText(b.dataset.sha).then(function () {
    b.textContent = 'Copied';
    setTimeout(function () { b.textContent = 'Copy'; }, 1200);
  });
});
